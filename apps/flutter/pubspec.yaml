name: smart_ble
description: Smart BLE - 跨平台蓝牙调试工具
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # BLE 库
  flutter_blue_plus: ^1.32.0
  flutter_ble_peripheral: ^2.0.1

  # 状态管理
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  rxdart: ^0.27.7

  # UI 组件
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # 工具类（零持久化：shared_preferences 已删，业务态仅内存——F023/F028 存储策略）
  permission_handler: ^11.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  share_plus: ^10.0.0
  # Smart HID 配网：ControlHub 配对码扫描（P002 · F020）
  mobile_scanner: ^5.2.3

  # 平台特定
  file_picker: ^11.0.2
  flutter_svg: ^2.3.0
  flutter_blue_plus_winrt: ^0.0.20
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # E13: P002 真机集成驱动（ValueKey 语义驱动，场景经 --dart-define 注入）
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dependency_overrides:
  # F-WIN：FBP 1.36.x 钉 interface 7.0.0、winrt 0.0.20 要 >=9.0.0，pub 只能回退 FBP 到
  # 1.34.5（hex 线缆）→ 与 winrt 原始字节线缆崩溃（_hexDecode 收 Uint8List）。两版接口
  # 解码同为透传、API 差异仅 bool? 可空化（diff 已核），抬到 9.0.3 让 FBP 1.36.8 与
  # winrt 共存，同时保住 Android/iOS 的 1.36.8 已验证基线。
  flutter_blue_plus_platform_interface: 9.0.3

flutter_launcher_icons:
  android: true
  ios: false
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  # UI-G2：品牌启动图（ChatGPT2API 生成 · 透明底 logo 居中 + 正典冰蓝底 #F8FBFF）
  color: "#F8FBFF"
  image: "assets/images/splash_logo.png"
  android: true
  ios: false
  android_12:
    color: "#F8FBFF"
    icon_background_color: "#F8FBFF"
    # A12 系统会把图标裁成圆——用无字标的磁贴专用图，防字标被裁掉
    image: "assets/images/splash_icon_a12.png"

# Flutter 配置
flutter:
  generate: true
  uses-material-design: true


  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
