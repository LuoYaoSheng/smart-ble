name: SmartBLE
options:
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: SmartBLE
    PRODUCT_BUNDLE_IDENTIFIER: com.smartble.ios
    PRODUCT_DISPLAY_NAME: Smart BLE
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: 72MZZQB893  # 本机开发团队（通配 profile 72MZZQB893.* 已含本机证书与真机）；换团队改这里后重跑 xcodegen generate
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_ASSET_PATHS: ""
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SmartBLE/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_CFBundleDisplayName: Smart BLE
packages:
  SmartHidCore:
    path: ../../core/apple/SmartHidCore
targets:
  SmartBLEiOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
      - path: SmartBLE/Resources
    dependencies:
      - package: SmartHidCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartble.ios
        INFOPLIST_FILE: SmartBLE/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SmartBLE/Resources/SmartBLE.entitlements
  SmartBLETests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/SmartBLETests
    dependencies:
      - target: SmartBLEiOS
      - package: SmartHidCore
    settings:
      base:
        PRODUCT_NAME: SmartBLETests
        PRODUCT_MODULE_NAME: SmartBLETests
        PRODUCT_BUNDLE_IDENTIFIER: com.smartble.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SmartBLE.app/SmartBLE"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SmartBLEUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/SmartBLEUITests
    dependencies:
      - target: SmartBLEiOS
    settings:
      base:
        PRODUCT_NAME: SmartBLEUITests
        PRODUCT_MODULE_NAME: SmartBLEUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.smartble.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SmartBLEiOS:
    build:
      targets:
        SmartBLEiOS: all
        SmartBLETests: [test]
        SmartBLEUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - SmartBLETests
        - SmartBLEUITests
