name: SmartBLEMac
options:
  bundleIdPrefix: com.i2kai.open
  deploymentTarget:
    macOS: "13.0"
packages:
  SmartHidCore:
    path: ../../../../core/apple/SmartHidCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: 1.0.5
    CURRENT_PROJECT_VERSION: 101
targets:
  SmartBLEMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [Resources]
      - path: Sources/Resources
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SmartBLE-mac
        PRODUCT_MODULE_NAME: SmartBLE_mac
        PRODUCT_BUNDLE_IDENTIFIER: com.i2kai.open.smartble
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements.plist
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        OTHER_SWIFT_FLAGS: ["$(inherited)", "-parse-as-library"]
    dependencies:
      - package: SmartHidCore
schemes:
  SmartBLEMac:
    build:
      targets:
        SmartBLEMac: all
    run:
      config: Debug
    archive:
      config: Release
