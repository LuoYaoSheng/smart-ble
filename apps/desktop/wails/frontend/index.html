<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SmartBLE</title>
</head>
<body>
<!-- G-WIN v1：P001 扫描 MVP（正典 kicker/标题/状态/按钮/附近设备）；
     全页镜像（P002~P010 + 生命周期正典）见计划文档 WIN-013 -->
<div id="app">
    <header class="page-head">
        <div>
            <div class="kicker">BLE TOOLKIT+</div>
            <h1 class="page-title">扫描</h1>
            <div class="status" id="status">待开始扫描</div>
        </div>
        <button class="btn primary" id="scanBtn">开始扫描</button>
    </header>
    <section class="card">
        <div class="card-title">附近设备</div>
        <ul class="device-list" id="deviceList"></ul>
        <div class="dim" id="emptyTip">点击「开始扫描」搜索附近 BLE 设备</div>
    </section>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
