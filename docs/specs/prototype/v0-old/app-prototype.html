<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE Toolkit+ 交互原型 · 基于旧项目逆向（9 页；2026-09-02 决策移除 PAGE004）</title>
<style>
  :root{
    --brand:#1B6DFF; --mint:#17C7A8; --red:#F2555F; --amber:#FF9F43;
    --text:#18222E; --sub:#42536A; --muted:#60758D; --line:#E3EAF3; --line-soft:#EDF2F9;
    --bg:#F8FBFF; --card:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; background:#E9EEF5; color:var(--text); display:flex; justify-content:center; padding:24px 12px; gap:22px; min-height:100vh;}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace;}

  /* ===== 评审桌面 ===== */
  .review{width:290px; flex-shrink:0; align-self:flex-start; position:sticky; top:24px; max-height:calc(100vh - 48px); overflow:auto; background:#101521; color:#D6E2F5; border-radius:16px; padding:18px 16px; font-size:13px;}
  .review h1{font-size:15px; margin-bottom:2px; color:#fff;}
  .review .sub{color:#7C8DA6; font-size:11px; margin-bottom:14px; line-height:1.6;}
  .review h2{font-size:11px; color:#8FA3C0; letter-spacing:1px; margin:14px 0 8px;}
  .pg-btn{display:flex; justify-content:space-between; width:100%; background:#1A2233; color:#D6E2F5; border:1px solid #263149; border-radius:9px; padding:7px 10px; margin-bottom:5px; cursor:pointer; font-size:12px;}
  .pg-btn:hover{background:#222C42;}
  .pg-btn.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .pg-btn .pid{color:#7C8DA6; font-size:10px;}
  .pg-btn.on .pid{color:#CFE0FF;}
  .sc-btn{display:block; width:100%; text-align:left; background:#1A2233; color:#B9CBE6; border:1px solid #263149; border-radius:8px; padding:6px 9px; margin-bottom:4px; cursor:pointer; font-size:12px;}
  .sc-btn:hover{background:#222C42; color:#fff;}
  .review .note{margin-top:14px; padding-top:12px; border-top:1px solid #263149; color:#7C8DA6; font-size:11px; line-height:1.7;}

  /* ===== 手机 ===== */
  .phone{width:395px; flex-shrink:0; background:#12151C; border-radius:46px; padding:10px; box-shadow:0 24px 60px rgba(10,20,40,.35);}
  .screen{width:375px; height:760px; background:var(--bg); border-radius:37px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .pagehost{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none;}
  .pagehost::-webkit-scrollbar{display:none;}

  /* 顶部导航 */
  .navbar{padding:54px 18px 12px; background:linear-gradient(180deg,#FFFFFF, #F8FBFF); border-bottom:1px solid var(--line-soft); position:relative;}
  .navbar .kicker{font-size:10px; letter-spacing:2px; color:var(--brand); font-weight:800;}
  .navbar .row{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .navbar .title{font-size:22px; font-weight:800;}
  .bt-dot{width:9px; height:9px; border-radius:50%; background:#9aa8b6; display:inline-block; margin-right:5px;}
  .bt-dot.on{background:var(--mint); box-shadow:0 0 8px rgba(23,199,168,.55);}
  .bt-chip{font-size:11px; color:var(--muted); font-weight:700;}
  .subnav{display:flex; align-items:center; gap:10px; padding:52px 14px 10px; background:#fff; border-bottom:1px solid var(--line-soft); position:sticky; top:0; z-index:5;}
  .back-btn{width:30px; height:30px; border:none; background:#F1F5FB; border-radius:9px; font-size:16px; color:var(--text); cursor:pointer; flex-shrink:0;}
  .subnav .t{font-size:16px; font-weight:700; flex:1;}

  .page-tag{position:absolute; top:12px; right:14px; background:#EAF1FF; color:var(--brand); font-size:9px; font-weight:800; padding:3px 7px; border-radius:999px; letter-spacing:.5px; z-index:9;}

  /* 通用卡片 */
  .content{padding:14px; display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 4px 14px rgba(24,50,90,.05);}
  .sec-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .sec-t{font-size:15px; font-weight:800;}
  .sec-c{font-size:11px; color:var(--muted); line-height:1.5;}
  .link{color:var(--brand); font-size:12px; font-weight:700; cursor:pointer;}
  .chip{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700;}
  .chip.brand{background:#EAF1FF; color:var(--brand);}
  .chip.mint{background:#E2F8F3; color:#0E8F79;}
  .chip.muted{background:#F0F3F8; color:var(--muted);}
  .chip.warn{background:#FFF2E5; color:#A6630A;}
  .chip.red{background:#FDEBEC; color:var(--red);}
  .chip.green{background:#E2F8F3; color:#0E9C82;}

  /* 按钮 */
  .btn{border:none; border-radius:12px; font-size:13px; font-weight:700; padding:9px 14px; cursor:pointer; color:#fff; background:var(--brand);}
  .btn.primary{background:var(--brand);}
  .btn.secondary{background:#EAF1FF; color:var(--brand);}
  .btn.ghost{background:#F0F3F8; color:var(--sub);}
  .btn.danger{background:var(--red);}
  .btn.lg{width:100%; padding:13px; font-size:15px; border-radius:14px;}
  .btn.sm{padding:6px 11px; font-size:12px; border-radius:9px;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* 空态 */
  .empty{display:flex; flex-direction:column; align-items:center; text-align:center; padding:34px 18px; gap:8px;}
  .empty .ico{font-size:34px; opacity:.5;}
  .empty .et{font-size:15px; font-weight:800;}
  .empty .ed{font-size:12px; color:var(--muted); line-height:1.6;}

  /* 错误横幅 */
  .err-banner{background:#FDEBEC; border:1px solid #F8CDD1; border-radius:12px; padding:10px 12px; margin-top:10px;}
  .err-banner .et{font-size:12px; font-weight:800; color:var(--red);}
  .err-banner .ec{font-size:11px; color:#B25B61; margin-top:3px; line-height:1.5;}

  /* 设备卡 */
  .dev{display:flex; gap:11px; padding:12px; border:1px solid var(--line-soft); border-radius:14px; background:#fff; margin-bottom:9px; align-items:center;}
  .dev .ava{width:44px; height:44px; border-radius:13px; background:linear-gradient(135deg,#1B6DFF,#5EA0FF); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;}
  .dev .ava.hid{background:linear-gradient(135deg,#17C7A8,#0E8F79);}
  .dev .ava.on{background:linear-gradient(135deg,#2AA8FF,#1B6DFF);}
  .dev .copy{flex:1; min-width:0;}
  .dev .nm{font-size:14px; font-weight:750; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .dev .id{font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dev .meta{font-size:10px; color:var(--muted); margin-top:2px;}
  .dev .ops{display:flex; gap:6px; flex-shrink:0; align-items:center;}
  .rssi{display:flex; align-items:flex-end; gap:2px; height:14px;}
  .rssi i{width:3px; background:#D3DEEC; border-radius:1px;}
  .rssi i:nth-child(1){height:4px}.rssi i:nth-child(2){height:7px}.rssi i:nth-child(3){height:10px}.rssi i:nth-child(4){height:13px}
  .rssi.l1 i:nth-child(-n+1),.rssi.l2 i:nth-child(-n+2),.rssi.l3 i:nth-child(-n+3),.rssi.l4 i{background:var(--brand);}
  .rssi.l1 i{background:#F1A93E;}
  .dbm{font-size:9px; color:var(--muted); margin-left:4px;}

  /* 筛选 */
  .filter{background:#F4F8FD; border:1px solid var(--line-soft); border-radius:13px; padding:12px; margin-bottom:10px;}
  .f-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:12px;}
  .f-presets{display:flex; gap:5px; flex-wrap:wrap;}
  .f-pre{border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:999px; padding:3px 9px; font-size:10px; cursor:pointer;}
  .f-pre.on{background:var(--brand); color:#fff; border-color:var(--brand);}
  .f-input{width:100%; height:34px; border:1px solid var(--line); border-radius:9px; padding:0 10px; font-size:12px; color:var(--text); background:#fff;}
  .sw{position:relative; width:40px; height:22px; background:#D6DFEB; border-radius:999px; cursor:pointer; transition:.2s; flex-shrink:0;}
  .sw.on{background:var(--brand);}
  .sw i{position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.2s;}
  .sw.on i{left:20px;}
  input[type=range]{flex:1; accent-color:var(--brand);}

  /* 步骤条 / 进度 */
  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:2px;}
  .step{background:#fff; border:1px solid var(--line); border-radius:11px; padding:9px 6px; text-align:center; font-size:11px; color:var(--muted); font-weight:700;}
  .step.cur{background:linear-gradient(135deg,#1B6DFF,#5EA0FF); color:#fff; border-color:transparent;}
  .step.done{color:#0E9C82; border-color:#BFEDE3; background:#F0FBF9;}
  .prow{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .prow:last-child{border-bottom:none;}
  .prow .dot{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;}
  .dot.pending{background:#F0F3F8; color:#9AA8B6;}
  .dot.active{background:#EAF1FF; color:var(--brand);}
  .dot.done{background:#E2F8F3; color:#0E9C82;}
  .dot.fail{background:#FDEBEC; color:var(--red);}
  .prow .st{margin-left:auto; font-size:11px; color:var(--muted);}

  /* 状态组件 */
  .op-state{border-radius:13px; padding:13px; display:flex; gap:10px; align-items:flex-start; font-size:12px; line-height:1.55;}
  .op-state.loading{background:#F4F8FD; border:1px solid var(--line-soft);}
  .op-state.error{background:#FDEBEC; border:1px solid #F8CDD1; color:#B25B61;}
  .op-state.success{background:#E9FAF6; border:1px solid #C4EFE5; color:#0E8F79;}
  .spin{width:16px; height:16px; border:2px solid #C9D9F2; border-top-color:var(--brand); border-radius:50%; animation:rot .8s linear infinite; flex-shrink:0; margin-top:2px;}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* 表单 */
  .fgroup{display:flex; flex-direction:column; gap:5px; margin-bottom:11px;}
  .flabel{font-size:12px; font-weight:750;}
  .fhint{font-size:10px; color:var(--muted);}
  .fin{width:100%; height:42px; border:1px solid var(--line); border-radius:11px; padding:0 12px; font-size:14px; background:#F7FAFE;}
  .fin:disabled{opacity:.6;}
  .action-card{display:flex; align-items:center; gap:11px; width:100%; border:1px solid var(--line); background:#fff; border-radius:14px; padding:12px; cursor:pointer; margin-bottom:11px; text-align:left;}
  .action-card .ic{width:40px; height:40px; border-radius:12px; background:#EAF1FF; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--brand); flex-shrink:0;}
  .action-card .tt{font-size:13px; font-weight:750;}
  .action-card .dd{font-size:10px; color:var(--muted); margin-top:2px;}
  .action-card .bdg{margin-left:auto; flex-shrink:0;}

  /* 服务树 */
  .svc{border:1px solid var(--line-soft); border-radius:13px; margin-bottom:9px; overflow:hidden; background:#fff;}
  .svc-h{display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; background:#fff;}
  .svc-h .arrow{transition:.2s; color:var(--muted); font-size:10px;}
  .svc.open .arrow{transform:rotate(90deg);}
  .svc-body{display:none; border-top:1px solid var(--line-soft);}
  .svc.open .svc-body{display:block;}
  .char{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid #F3F7FC; font-size:12px;}
  .char:last-child{border-bottom:none;}
  .char .cn{flex:1; min-width:0;}
  .char .cid{font-size:9px; color:var(--muted);}
  .char .ops{display:flex; gap:5px;}

  /* 日志 */
  .logwrap{background:#0F1622; border-radius:16px; padding:12px; color:#C7D6EC; font-size:10px;}
  .logwrap .lh{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; color:#8FA3C0; font-size:11px; font-weight:700;}
  .logline{display:flex; gap:7px; padding:3px 0; line-height:1.5; font-family:"SF Mono",Menlo,monospace; word-break:break-all;}
  .logline .t{color:#5D6F8C; flex-shrink:0;}
  .lt{flex-shrink:0; padding:0 6px; border-radius:5px; font-size:9px; font-weight:800; height:15px; line-height:15px;}
  .lt.sys{background:#26314A; color:#9FB4D6;} .lt.err{background:#4A2430; color:#FF8B94;}
  .lt.read{background:#24384A; color:#7FD1F5;} .lt.write{background:#3A3324; color:#F5C97B;}
  .lt.recv{background:#1F4038; color:#6FD9BC;} .lt.ok{background:#28402F; color:#8FE3A8;}

  /* tabBar */
  #tabbar{display:flex; background:#F8FBFF; border-top:1px solid var(--line-soft); padding:7px 0 16px;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:#7B8FA5; cursor:pointer; font-weight:600;}
  .tab .ti{font-size:19px;}
  .tab.on{color:var(--brand);}

  /* toast / modal */
  #toast{position:absolute; left:50%; bottom:110px; transform:translateX(-50%) translateY(12px); background:rgba(20,28,42,.92); color:#fff; font-size:12px; padding:9px 16px; border-radius:11px; opacity:0; pointer-events:none; transition:.22s; z-index:60; max-width:82%; text-align:center; line-height:1.5;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .mask{position:absolute; inset:0; background:rgba(12,18,30,.45); z-index:50; display:flex; align-items:flex-end;}
  .sheet{background:#fff; width:100%; border-radius:20px 20px 0 0; padding:18px; max-height:82%; overflow:auto;}
  .sheet .sh-t{font-size:16px; font-weight:800; margin-bottom:6px;}
  .sheet .sh-c{font-size:13px; color:var(--sub); line-height:1.65;}
  .sheet .acts{display:flex; gap:9px; margin-top:15px;}
  .sheet .acts .btn{flex:1;}
  .dialog{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:82%; background:#fff; border-radius:17px; padding:19px; z-index:55;}
  .progress-bg{height:7px; background:#EDF2F9; border-radius:99px; overflow:hidden; margin:10px 0 4px;}
  .progress-fg{height:100%; background:linear-gradient(90deg,#1B6DFF,#5EA0FF); border-radius:99px; transition:width .18s;}
  .kv{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #F3F7FC; font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted); flex-shrink:0;}
  .kv .v{font-weight:650; text-align:right; word-break:break-all;}
  .menu-item{display:flex; align-items:center; justify-content:space-between; padding:12px 13px; background:rgba(255,255,255,.85); border-radius:12px; margin-bottom:8px; font-size:14px; font-weight:600; cursor:pointer;}
  .menu-item .ar{color:var(--brand); font-size:17px;}
  .appcard{display:flex; gap:11px; align-items:center; border:1px solid var(--line-soft); border-radius:13px; padding:11px; margin-bottom:8px; cursor:pointer; background:#fff;}
  .appcard .ic{width:42px; height:42px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff;}
  .appcard .an{font-size:13px; font-weight:750;}
  .appcard .ad{font-size:10px; color:var(--muted); margin-top:2px;}
  .feat-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .feat{display:flex; gap:7px; align-items:center; background:rgba(255,255,255,.85); border-radius:11px; padding:9px 10px; font-size:11px; font-weight:700;}
  .feat .n{color:var(--brand); background:#EAF1FF; border-radius:6px; width:17px; height:17px; display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0;}
  .plat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px;}
  .plat{background:rgba(27,109,255,.07); border-radius:11px; padding:8px; text-align:center; color:var(--brand);}
  .plat .pn{font-size:11px; font-weight:750;}
  .plat .ps{font-size:9px; font-weight:800; opacity:.8; margin-top:2px;}
  .diag-row{display:flex; flex-direction:column; gap:5px; padding:9px 0; border-bottom:1px solid #F3F7FC;}
  .diag-head{display:flex; align-items:center; gap:9px; font-size:13px;}
  .diag-dot{width:21px; height:21px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;}
  .diag-dot.ok{background:rgba(23,199,168,.16); color:#0E9C82;} .diag-dot.warn{background:rgba(255,159,67,.16); color:#D37A12;}
  .diag-dot.fail{background:rgba(242,85,95,.14); color:var(--red);} .diag-dot.active{background:rgba(27,109,255,.12); color:var(--brand);}
  .diag-dot.pending{background:#F0F3F8; color:#9AA8B6;}
  .diag-label{flex:1; font-weight:650;}
  .diag-state{font-size:11px; color:var(--muted);}
  .diag-detail{font-size:11px; color:var(--sub); padding-left:30px; line-height:1.5;}
  .picker-row{display:flex; align-items:center; justify-content:space-between; font-size:13px; margin-bottom:9px;}
  select.picker{border:1px solid var(--line); background:#F7FAFE; border-radius:9px; padding:6px 9px; font-size:12px; color:var(--text);}
  .bytes-hint{background:#EAF1FF; border-radius:11px; padding:9px 11px; font-size:11px; color:var(--brand); display:flex; gap:8px; align-items:center;}
  .bytes-hint.over{background:#FDEBEC; color:var(--red);}
  .uuid-hint{background:#FFF2E5; border-radius:11px; padding:9px 11px; font-size:11px; color:#A6630A;}
  @media (max-width: 760px){ .review{display:none;} }
</style>
</head>
<body>

<aside class="review">
  <h1>BLE Toolkit+ 评审原型</h1>
  <div class="sub">旧项目逆向重建 · 单文件 · 全模拟数据 · 无后端<br>对应 PRD：docs/02_product/PRD.md</div>
  <h2>页面直达</h2>
  <div id="pgnav"></div>
  <h2>当前页场景</h2>
  <div id="scnav"></div>
  <div class="note">
    红线遵守：未删除任何复杂功能、未隐藏按钮、未简化流程、未新增商业功能。<br><br>
    现状标注：F017 观察证据匹配、F030 国际化在真实产品中即为「服务层就绪/未接线」状态，原型如实标注。
  </div>
</aside>

  <div class="phone">
  <div class="screen">
    <div id="pagetag" style="position:absolute; top:10px; right:14px; z-index:40;"></div>
    <div id="pagehost" class="pagehost"></div>
    <div id="tabbar"></div>
    <div id="toast"></div>
    <div id="overlay"></div>

</div>

<script>
/* =========================================================
   BLE Toolkit+ 交互原型（PAGE001/002/003/005/006/007/008/009/010；PAGE004 已按 2026-09-02 用户决策移除）
   事实源：docs/01_reverse/REVERSE_ANALYSIS.md → docs/02_product/PRD.md → docs/03_flow/PAGE_SPEC.md
   ========================================================= */

/* ---------- 模拟数据 ---------- */
const MOCK = {
  scanDevices: [
    {deviceId:'SHID-A1B2C3', name:'SHID-A1B2C3', rssi:-52, profileId:'smart-hid', matchLevel:'STRONG', advComplete:true},
    {deviceId:'F2:6A:9C:11:03:7E', name:'Mi Smart Band 8', rssi:-61, advComplete:true},
    {deviceId:'C8:3E:99:0A:22:5F', name:'LightBLE-Observer', rssi:-66, advComplete:false},
    {deviceId:'5A:1F:BB:90:7C:D2', name:'', rssi:-77, advComplete:true},
    {deviceId:'AA:2C:44:8E:10:09', name:'JBL Flip 6', rssi:-84, advComplete:true},
  ],
  knownDevicesRemoved: null, /* 2026-09-02 用户决策：移除「已配置 Smart HID」面板与历史页，knownDevices 概念不再呈现 */
  services: [
    {uuid:'00001800-0000-1000-8000-00805f9b34fb', name:'通用访问 (0x1800)', open:true, chars:[
      {uuid:'00002a00-0000-1000-8000-00805f9b34fb', name:'Device Name (0x2A00)', props:{read:true, write:true}, value:'SHID-A1B2C3', hex:'53 48 49 44 2D 41 31 42 32 43 33'},
      {uuid:'00002a01-0000-1000-8000-00805f9b34fb', name:'Appearance (0x2A01)', props:{read:true}, value:'Unknown (0x0000)', hex:'00 00'},

let toastTimer = null;

function modal({title, content, confirmText='确定', cancelText='取消', onConfirm, onCancel, hideCancel=false, custom=''}){
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<div class="mask" data-mask="1">

      <div class="sh-t">${esc(title)}</div>

        <button class="btn primary" data-act="modal-ok">${esc(confirmText)}</button>
      </div>
    </div></div>`;
  ov.querySelector('[data-act=modal-ok]').onclick = () => { closeOverlay(); onConfirm && onConfirm(); };
  const c = ov.querySelector('[data-act=modal-cancel]');
  if(c) c.onclick = () => { closeOverlay(); onCancel && onCancel(); };
  ov.querySelector('[data-mask]').addEventListener('click', e => { if(e.target.dataset.mask){ closeOverlay(); onCancel && onCancel(); } });
}

function canSubmitP002(){ const st=S.p002; return st.ssid.trim() && st.hub.trim() && st.token && !st.provisioning; }
function p002StartProvision(errPlan){
  const st = S.p002;
  st.phase='status'; st.provisioning=true; st.done=false; st.err=null;
  st.progress = {wifi:'active', hub:'pending', conn:'pending', usb:'pending'};
  renderAll();
  const chain = [
    [900,  ()=>{ st.progress.wifi='done'; st.progress.hub='active'; renderAll(); }],
    [1800, ()=>{ st.progress.hub='done'; st.progress.conn='active'; renderAll(); }],
    [2700, ()=>{ st.progress.conn='done'; st.progress.usb='active'; renderAll(); }],
    [3600, ()=>{ st.progress.usb='done'; st.provisioning=false; st.done=true;
                 toast('设备已就绪（READY）'); renderAll(); }],
  ];
  if(errPlan === 'wifi_failed'){
    chain.length = 1; later(950, ()=>{ st.progress.wifi='fail'; st.provisioning=false;
      st.err={title:'Wi-Fi 连接失败（wifi_failed）', msg:'设备未能连接到指定 Wi-Fi。请确认 SSID 与密码后重试。', label:'返回表单修改（form）'}; renderAll(); });
  } else if(errPlan === 'pairing_expired'){
    chain.length = 2; later(1850, ()=>{ st.progress.hub='fail'; st.provisioning=false;
      st.err={title:'配对码已过期（pairing_expired）', msg:'ControlHub 返回配对凭据过期，请在 ControlHub 重新生成配对码后重扫。', label:'重新扫描配对码（pairing）'}; renderAll(); });
  } else if(errPlan === 'controlhub_unreachable'){
    chain.length = 2; later(1850, ()=>{ st.progress.hub='fail'; st.provisioning=false;
      st.err={title:'ControlHub 不可达（controlhub_unreachable）', msg:'设备无法连接 ControlHub 地址。可运行诊断定位网络链路。', label:'运行诊断（diagnostics）'}; renderAll(); });
  }
  chain.forEach(([ms,fn])=>later(ms,fn));
}

function p005Run(results){
  const st = S.p005;
  st.state='checking';

function bCalcBytes(){
  const st = S.p008; let n = 0;

  if(incName && st.name) n += 2 + st.name.length;
  if(incUuid && st.uuid) n += 2 + (st.uuid.length<=8 ? 2 : 16);
  if(st.mfgId || st.mfgData) n += 2 + 2 + (st.mfgData ? st.mfgData.length : 0);
  return n;
}

const RENDER = {p001:renderP001, p002:renderP002, p003:renderP003, p005:renderP005,

function renderAll(){
  const id = cur();
  document.getElementById('pagetag').innerHTML = `<div class="page-tag">${PAGES[id].tag}</div>`;
  document.getElementById('pagehost').innerHTML = RENDER[id]();
  const tb = document.getElementById('tabbar');
  tb.style.display = TABS.includes(id) ? 'flex' : 'none';
  if(TABS.includes(id)){
    const icons = {p001:'🔎', p007:'🔗', p008:'📡', p009:'ℹ️'};
    const names = {p001:'扫描', p007:'已连接', p008:'广播', p009:'关于'};
    tb.innerHTML = Object.keys(names).map(k=>`<div class="tab ${k===id?'on':''}" data-act="tab" data-id="${k}">
      <span class="ti">${icons[k]}</span><span>${names[k]}</span></div>`).join('');
  } else { tb.innerHTML = ''; }
  renderReview();
}
function renderReview(){
  const nav = document.getElementById('pgnav');
  nav.innerHTML = Object.keys(PAGES).map(id=>`<button class="pg-btn ${id===cur()?'on':''}" data-act="jump" data-id="${id}">
    <span>${PAGES[id].title}${PAGES[id].tab?' <span style="opacity:.6;font-size:10px">Tab</span>':''}</span><span class="pid">${id.replace('p','PAGE').slice(0,3)===id.replace('p','PAGE').slice(0,3)?id.toUpperCase().replace('P0','PAGE0').replace('P10','PAGE10'):''}</span></button>`).join('');
  const sc = document.getElementById('scnav');
  const list = SCEN[cur()] || [];
  sc.innerHTML = list.length ? list.map((s,i)=>`<button class="sc-btn" data-act="scen" data-i="${i}">${s.label}</button>`).join('')

}

/* ---------- 动作注册表 ---------- */
function findDev(id){ return MOCK.scanDevices.find(d=>d.deviceId===id) || MOCK.connected.find(d=>d.deviceId===id); }
const ACTIONS = {
  tab: el => switchTab(el.dataset.id),
  jump: el => { const id=el.dataset.id; if(TABS.includes(id)) switchTab(id); else go(id); },
  scen: el => { (SCEN[cur()]||[])[+el.dataset.i].apply(); },
  back: () => {
    if(cur()==='p002' && S.p002.provisioning && !S.p002.done){
      modal({title:'离开确认', content:'配网正在进行中，离开将取消本次等待（设备侧可能继续执行）。确定离开吗？',
        confirmText:'离开', onConfirm:()=>back()});
      return;
    }
    back();
  },
  'go-scan': () => switchTab('p001'),
  /* P001 */
  'toggle-scan': () => {
    const st = S.p001;
    if(st.scanning){ st.scanning=false; renderAll(); return; }
    if(st.bt==='off'){ modal({title:'提示',content:'请先打开系统蓝牙',confirmText:'去开启',hideCancel:true}); return; }
    if(st.bt==='unsupported'){ st.scanError={code:'ble_unsupported',message:'当前平台不支持 BLE，无法扫描。'}; renderAll(); return; }
    st.scanning=true; st.scanned=false; st.scanError=null; st.shown=[]; renderAll();
    later(800, ()=>{ st.shown = MOCK.scanDevices.slice(0,2); renderAll(); });
    later(1600, ()=>{ st.shown = MOCK.scanDevices.slice(0,4); renderAll(); });
    later(2400, ()=>{ st.shown = MOCK.scanDevices; st.scanning=false; st.scanned=true; renderAll(); toast(`扫描完成 · 发现 ${MOCK.scanDevices.length} 台设备`); });
  },
  'toggle-filter': () => { S.p001.filterOpen=!S.p001.filterOpen; renderAll(); },
  'set-rssi': el => { S.p001.filter.rssi=+el.dataset.v; renderAll(); },
  'reset-filter': () => { S.p001.filter={rssi:-100,prefix:'',hideNoName:false}; renderAll(); },
  'toggle-noname': () => { S.p001.filter.hideNoName=!S.p001.filter.hideNoName; renderAll(); },
  'connect-generic': el => { const d=findDev(el.dataset.id); S.p006.device=d; S.p006.panel='connecting'; S.p006.logs=[]; go('p006');
    later(1400, ()=>{ S.p006.panel='ready'; addLog('系统','连接成功 · 服务发现完成（4 服务 / 7 特征）'); renderAll(); }); },
  'open-profile': el => { const d=findDev(el.dataset.id); S.p002.device=d; S.p002.phase='connect'; S.p002.connecting=true; S.p002.connError=null; go('p002');
    later(1200, ()=>{ S.p002.connecting=false; S.p002.phase='configure'; renderAll(); }); },
  'open-adv': el => { const d = findDev(el.dataset.id); if(!d) return; S.p001.adv = d; renderAll(); },
  'copy-adv': () => copy('BLE 广播数据报告（模拟）', '已复制'),
  'close-adv': () => { S.p001.adv=null; renderAll(); },
  /* P002 */
  'p002-reconnect': () => { S.p002.connecting=true; S.p002.connError=null; renderAll(); later(1200,()=>{S.p002.connecting=false; S.p002.phase='configure'; renderAll();}); },
  'p002-godevices': () => switchTab('p001'),
  'p002-reconnect-lost': () => { S.p002.lost=true; renderAll(); later(1300,()=>{S.p002.lost=false; toast('已重新连接，可继续下发'); renderAll();}); },
  'p002-scanqr': () => {
    modal({title:'模拟扫码 · ControlHub 配对码', content:'真实产品此处调起相机扫描 <span class="mono">shid://pair?token=…&host=…&port=17892</span>。请选择演示结果：',
      custom:`<div style="display:flex;flex-direction:column;gap:7px;margin-top:12px">
        <button class="btn secondary sm" data-qr="ok">✅ 扫码成功（回填地址+获取 token）</button>
        <button class="btn ghost sm" data-qr="cancel">↩️ 用户取消</button>
        <button class="btn ghost sm" data-qr="perm">🔒 相机权限被拒绝</button>
        <button class="btn ghost sm" data-qr="bad">⚠️ 无效二维码</button></div>`, confirmText:'关闭', cancelText:'关闭'});
    document.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => {
      const r = b.dataset.qr; closeOverlay();
      if(r==='ok'){ S.p002.hub='192.168.1.8:17892'; S.p002.token='simulated-token-32hex'; toast('配对码已识别 · 地址已回填'); }
      if(r==='cancel'){ toast('已取消扫码'); }
      if(r==='perm'){ toast('相机权限被拒绝，可在系统设置中开启后重试'); }
      if(r==='bad'){ toast('二维码内容不是有效的 shid://pair 配对码'); }
      renderAll();
    });
  },
  'p002-submit': () => { if(!canSubmitP002()) return; p002StartProvision(); },
  'p002-cancelwait': () => { S.p002.provisioning=false; S.p002.err={title:'已取消等待', msg:'等待被取消（演示等待超时同款路径）。可重新下发配置。', label:'重新下发（retry）'}; renderAll(); },
  'p002-viewdetail': () => { S.p003.device={...S.p002.device, protocol:'V1', firmware:'1.1.1', lastWifi:S.p002.ssid, lastHub:S.p002.hub}; redirect('p003'); },
  'p002-recovery': () => {
    const st=S.p002;
    if(st.err.label.includes('form')){ st.phase='configure'; st.err=null; st.done=false; renderAll(); }
    else if(st.err.label.includes('pairing')){ st.phase='configure'; st.err=null; st.token=null; renderAll(); toast('请重新扫描配对码'); }
    else if(st.err.label.includes('诊断')){ S.p005.device=st.device; S.p005.state='connected'; go('p005'); }
    else { p002StartProvision(); }
  },
  /* P003 */
  'p003-reconfigure': () => { S.p002.device=S.p003.device; S.p002.phase='connect'; S.p002.connecting=true; go('p002'); later(1200,()=>{S.p002.connecting=false; S.p002.phase='configure'; renderAll();}); },
  'p003-diag': () => { S.p005.device=S.p003.device; S.p005.state='connected'; go('p005'); },
  'p003-advanced': () => { S.p006.device=S.p003.device; S.p006.panel='connecting'; go('p006'); later(1400,()=>{S.p006.panel='ready'; addLog('系统','连接成功 · 服务发现完成'); renderAll();}); },
  /* P005 */
  'p005-refresh': () => {
    const st=S.p005;
    if(st.state!=='connected' && st.state!=='live'){
      st.state='offline';
      modal({title:'BLE 未连接', content:'诊断需要重新连接当前设备。请让设备保持可发现状态后继续。', confirmText:'连接并检测',
        onConfirm:()=>{ st.connecting=true; st.state='checking'; renderAll(); later(1200,()=>{ st.connecting=false; p005Run({}); toast('已连接 · 读取实时状态'); }); },
        onCancel:()=>{ st.state='idle'; renderAll(); }});
      renderAll(); return;
    }
    p005Run({});
  },
  'p005-advanced': () => { S.p005.advanced=!S.p005.advanced; renderAll(); },
  'p005-godetail': () => { if(S.stack.includes('p003')) back(); else { S.p003.device=S.p005.device; go('p003'); } },
  'p005-reconfig': () => {
    modal({title:'重新配网', content:'已完成配置（READY）的设备会关闭蓝牙广播。请先让设备进入配网/恢复模式（参考设备说明书），确认后再继续。', confirmText:'已进入配网模式',
      onConfirm:()=>{ if(S.stack.includes('p002')) back(); else { S.p002.device=S.p005.device; S.p002.phase='connect'; S.p002.connecting=true; go('p002'); later(1200,()=>{S.p002.connecting=false; S.p002.phase='configure'; renderAll();}); } }});
  },
  /* P006 */
  'p006-toggleconn': () => {
    const st=S.p006;
    if(st.panel==='ready'){ st.panel='idle'; addLog('系统','已断开连接（主动断开 · 不触发自动重连）'); renderAll(); return; }
    st.panel='connecting'; st.connecting=true; st.connError=null; renderAll();
    later(1400,()=>{ st.connecting=false; st.panel='ready'; addLog('成功','连接成功 · 服务发现完成（4 服务 / 7 特征）'); renderAll(); });
  },
  'p006-retry': () => { S.p006.panel='connecting'; renderAll(); later(1400,()=>{S.p006.panel='ready'; addLog('成功','手动重试成功 · 会话 READY'); renderAll();}); },
  'p006-clearlogs': () => { S.p006.logs=[]; renderAll(); },
  'p006-exportlogs': () => { if(S.p006.logs.length===0){ toast('暂无日志'); return; }
    copy(S.p006.logs.map(l=>`[${l.time}] ${l.type} ${l.msg}`).join('\n'), '日志已复制'); },
  'p006-togglesvc': el => { const svc=MOCK.services.find(s=>s.uuid===el.dataset.svc); svc.open=!svc.open; renderAll(); },
  'p006-expandall': () => { const anyClosed=MOCK.services.some(s=>!s.open); MOCK.services.forEach(s=>s.open=anyClosed); renderAll(); },
  'p006-read': el => { const ch=MOCK.services.flatMap(s=>s.chars).find(c=>c.uuid===el.dataset.ch);
    addLog('系统','读请求已发送'); renderAll();
    later(450, ()=>{ addLog('接收', `HEX: ${ch.hex||'(空)'}\nTEXT: ${ch.value||''}`); renderAll(); }); },
  'p006-write': el => { const ch=MOCK.services.flatMap(s=>s.chars).find(c=>c.uuid===el.dataset.ch);
    S.p006.write={charId:ch.uuid, charName:ch.name, type:'text', value:'', sending:false}; renderAll(); },
  'p006-notify': el => { const ch=MOCK.services.flatMap(s=>s.chars).find(c=>c.uuid===el.dataset.ch);
    const on = !S.p006.notify[ch.uuid]; S.p006.notify[ch.uuid]=on;
    addLog('系统', on?'开启监听成功':'关闭监听成功'); renderAll();
    if(on) later(1400, ()=>{ if(S.p006.notify[ch.uuid]){ addLog('接收','HEX: 55\nTEXT: 85%（notify 推送）'); renderAll(); } }); },
  'p006-closewrite': () => { S.p006.write=null; renderAll(); },
  'p006-confirmwrite': () => {
    const w=S.p006.write; const v=(w.value||'').trim();
    if(!v){ toast('请输入数据'); return; }
    if(w.type==='hex'){
      const clean=v.replace(/\s+/g,'');
      if(!/^[0-9a-fA-F]+$/.test(clean) || clean.length%2!==0){ toast('HEX 格式无效：仅允许 0-9 A-F 与空格，且为偶数长度'); return; }
    }
    w.sending=true; renderAll();
    later(500, ()=>{ addLog('写入', `${w.type.toUpperCase()}: ${v}`); S.p006.write=null; toast('写入成功'); renderAll(); });
  },
  'p006-ota': () => { S.p006.ota={phase:'pick', target:'lightble-peripheral', percent:0}; renderAll(); },
  'p006-pickfile': () => {
    const o=S.p006.ota; o.phase='validating'; o.note='manifest.json 校验 · sha256 比对'; o.percent=10; renderAll();
    const s0 = seq();
    later(900, ()=>{
      if(S.p006.scenOtaFail){ o.phase='failed'; o.errTitle='OTA_HASH_MISMATCH'; o.errMsg='固件包 sha256 与 manifest 声明不一致，已终止（错误包不得进入 OTA 事务）。'; S.p006.scenOtaFail=false; renderAll(); return; }
      o.phase='transferring'; o.note='分包传输 · chunk 180B · 20ms 间隔'; o.percent=0; renderAll();
      const iv=setInterval(()=>{
        if(s0!==seq()){ clearInterval(iv); return; }
        o.percent=Math.min(100,(o.percent||0)+Math.ceil(Math.random()*9+4));
        const el=document.querySelector('.progress-fg');
        if(el){ el.style.width=o.percent+'%'; }
        const lab=document.querySelector('.sheet .mono');
        if(o.percent>=100){ clearInterval(iv); o.phase='committing'; o.note='提交（commit）· 等待设备 success（30s）'; o.percent=100; renderAll();
          later(1000, ()=>{ o.phase='verifying'; o.note='重连回读固件版本比对'; renderAll();
            later(1100, ()=>{ o.phase='success'; renderAll(); later(2000, ()=>{ S.p006.ota=null; renderAll(); }); }); });
        }
      }, 260);
    });
  },
  'p006-closeota': () => {
    const o=S.p006.ota;
    if(['transferring','committing','validating','verifying'].includes(o.phase)){ o.phase='cancelled'; addLog('系统','OTA 已取消 · 已发送 abort'); renderAll(); later(1500,()=>{S.p006.ota=null; renderAll();}); return; }
    S.p006.ota=null; renderAll();
  },
  /* P007 */
  'p007-open': el => { const d=MOCK.connected.find(c=>c.deviceId===el.dataset.id);
    if(d.profileId){ S.p003.device={...d, protocol:'V1', firmware:'1.1.1', lastWifi:'Home-5G', lastHub:'192.168.1.8:17892'}; go('p003'); }
    else { S.p006.device=d; S.p006.panel='ready'; S.p006.logs=[{time:nowStr(),type:'系统',msg:'复用已有会话进入'}]; go('p006'); } },
  'p007-disconnect': el => { MOCK.connected = MOCK.connected.filter(c=>c.deviceId!==el.dataset.id); toast('已断开'); renderAll(); },
  'p007-disconnectall': () => {
    const failed = MOCK.connected[0];
    MOCK.connected = MOCK.connected.filter(c=>c===failed);
    modal({title:'部分设备未能断开', content:`失败设备：${failed.name}（errCode 10009 · 连接已断开）<br>其余设备已断开成功。`, confirmText:'知道了', hideCancel:true});
    renderAll();
  },
  /* P008 */
  'p008-toggle': () => {
    const st=S.p008;
    if(st.platform==='web'){ toast('当前平台不支持 BLE 广播，请使用微信小程序或 App。'); return; }
    if(st.advertising){ st.advertising=false; st.state='stopped'; bLog('操作','广播已停止'); renderAll(); return; }
    if(!bValidUuid(st.uuid)){ toast('Service UUID 格式无效'); return; }
    if(bCalcBytes()>31){ toast('广播包超出 31 字节限制（'+bCalcBytes()+'B），请精简内容'); return; }
    if(st.platform==='android'){
      if(st.btOff){ modal({title:'提示',content:'请先开启系统蓝牙',confirmText:'去开启'}); return; }
      if(st.permMissing){ modal({title:'权限请求',content:'需要蓝牙广播、连接、扫描和位置权限，请在系统设置中手动开启',confirmText:'去设置'}); return; }
      bLog('操作','startAdvertising · mode='+['低功耗','平衡','低延迟'][st.mode]+' · power='+['超低','低','中','高'][st.power]+' · connectable='+st.connectable);
    } else if(st.platform==='weixin'){
      if(st.supported===false){ toast('蓝牙从机模式未就绪，请先点击「检查支持」'); return; }
      bLog('操作','server.startAdvertising · powerLevel='+['low','medium','high','high'][st.power]);
    }
    st.advertising=true; st.state='idle'; bLog('成功','广播已启动 · '+bCalcBytes()+' 字节');
    renderAll();
  },
  'p008-check': () => {
    const st=S.p008;
    if(st.platform==='weixin'){
      if(st.scenDevtools){ bLog('系统','开发者工具不支持 BLE 外围服务，请使用真机调试广播功能'); st.supported=false; renderAll(); return; }
      if(st.scenActiveConn){ bLog('错误','蓝牙从机模式初始化失败: 请先断开已连接设备（active_connections）'); st.supported=false; renderAll(); return; }
      bLog('系统','蓝牙从机模式已就绪'); st.supported=true;
    } else if(st.platform==='android'){
      bLog('系统','设备支持低功耗蓝牙广播（原生插件）'); st.supported=true;
    } else { st.supported=false; bLog('系统','当前平台不支持 BLE 广播，请使用微信小程序或 App。'); }
    renderAll();
  },
  'p008-sw': el => { S.p008[el.dataset.k]=!S.p008[el.dataset.k]; renderAll(); },
  /* P009 */
  'p009-website': () => copy('https://lightble.i2kai.com', '网址已复制'),
  'p009-feedback': () => copy('https://gitee.com/luoyaosheng/smart-ble/issues', '反馈链接已复制'),
  'p009-version': () => go('p010'),
  'p009-share': () => toast('请点击右上角分享（微信端行为模拟）'),
  'p009-openapp': el => { const a=MOCK.apps[+el.dataset.i];
    if(!a.appId){ toast('该小程序暂未配置跳转'); return; }
    modal({title:`打开「${a.name}」`, content:`模拟 navigateToMiniProgram<br>appId: <span class="mono">${a.appId}</span>`, confirmText:'知道了', hideCancel:true}); },
  /* P010 */
  'p010-copyver': () => copy('1.0.5 (build 101) · preview', '版本已复制'),
};

/* 输入桥（重渲染后仍生效的受控输入） */
window.APP = {
  setRssi(v){ S.p001.filter.rssi=+v; const lab=document.getElementById('rssilabel'); if(lab) lab.textContent=`信号强度 ≥ ${v} dBm`; renderAllSoft(); },
  setPrefix(v){ S.p001.filter.prefix=v; renderAllSoft(); },
  p002set(k,v){ S.p002[k]=v; renderAllSoft(); },
  p006wtype(t){ S.p006.write.type=t; renderAll(); },
  p006wval(v){ S.p006.write.value=v; },
  p008set(k,v){ S.p008[k]=k==='mode'||k==='power'?+v:v; renderAllSoft(); },
};
/* 软重渲染：保留输入焦点——仅重绘受影响区域（此处简化为列表/字节提示局部刷新） */
function renderAllSoft(){
  const id = cur();
  if(id==='p001'){
    const el=document.getElementById('devlist');
    if(el){ const list=filteredDevices();
      el.innerHTML = list.length ? list.map(d=>devCard(d)).join('') :
        `<div class="empty"><div class="ico">🔎</div><div class="et">${S.p001.shown.length>0?'当前没有匹配设备':'还没有扫描结果'}</div>
         <div class="ed">${S.p001.shown.length>0?'调整筛选试试。':'点上方按钮开始扫描。'}</div></div>`; }
    return;
  }
  if(id==='p002'){ /* 输入中不整页重绘，只更新提交按钮态 */
    const btn=document.querySelector('[data-act=p002-submit]');
    if(btn) btn.disabled=!canSubmitP002();
    const badge=document.querySelector('.action-card .bdg');
    return;
  }
  if(id==='p008'){
    const bytes=bCalcBytes(); const hint=document.getElementById('byteshint');
    if(hint){ hint.className='bytes-hint '+(bytes>31?'over':''); hint.firstChild.textContent=`预计广播包大小：${bytes} / 31 字节`; }
    return;
  }
}

/* 事件委托：closest 取最近 data-act，天然实现卡片与内部按钮互斥 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = ACTIONS[el.dataset.act];
  if(act) act(el, e);
});

/* 启动 */
SCEN.p001[0].apply();
renderAll();
/* 评审/测试可观测钩子（只读用途） */
window.S = S; window.MOCK = MOCK;
</script>
</body>
