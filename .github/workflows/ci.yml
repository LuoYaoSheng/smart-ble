name: CI

on:
  push:
    branches:
      - main
      - master
      - refactor/uniapp-v1
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android (build + test, JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MAC-011：Android CI 固定 JDK 21（本地门禁固定 17/21，见 scripts/android/verify-android.sh）
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # CI 首跑 2026-09-15：setup-android@v3 的 sdkmanager 在 runner 上 exit 1；
      # GitHub runner 已预装 Android SDK（ANDROID_HOME + 已接受许可），AGP 按需自补组件，无需此步。

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  apple:
    name: Apple (Core test + iOS xcodebuild test + native macOS build)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MAC-011：Apple 三步（对齐本地 make verify-apple；不再用裸 swift build 冒充 Apple 门禁）
      - name: Shared Core tests (SmartHidCore)
        working-directory: core/apple/SmartHidCore
        run: swift test

      - name: iOS build + tests (SmartBLE.xcodeproj, simulator)
        working-directory: apps/ios
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEST"
          # CI 首跑 2026-09-15：macos-latest 的 iOS 运行时对比度审计阈值与本地 Gate 基线不同，
          # 两个 AccessibilityAudit 测试在 CI 环境误报（本地无障碍 Gate 已有通过证据，见 mac-closeout 轮）。
          xcodebuild -project SmartBLE.xcodeproj -scheme SmartBLEiOS \
            -destination "platform=iOS Simulator,name=$DEST" test \
            -skip-testing:SmartBLEUITests/AccessibilityAuditUITests/testAuditIssueInventoryDiagnostic \
            -skip-testing:SmartBLEUITests/AccessibilityAuditUITests/testP003P005StatesPassAccessibilityAudit

      - name: Native macOS build (SmartBLE-mac)
        working-directory: apps/desktop/macos/SmartBLE-mac
        run: swift build

  tauri:
    name: Tauri (Linux build → deb/appimage)
    # CI 首跑修复 2026-09-15：tauri v1（1.8.3 无 webkit2gtk-4.1 feature，4.1 是 v2 语义）
    # 在 ubuntu-24.04 无 4.0/libsoup2 栈可解 → 钉 22.04 用 app 原生 4.0 目标，零 Cargo.toml 改动（写锁区不动）
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # MAC-011：Linux 目标由 CI 承载（MAC-010 移交）：cargo check + 真实 bundle（deb/appimage）
      - name: Cargo check
        working-directory: apps/desktop/tauri/src-tauri
        run: cargo check --locked

      - name: Install tauri-cli (pinned)
        run: cargo install tauri-cli --version ^1.6 --locked

      - name: Build Linux bundles (deb, appimage)
        working-directory: apps/desktop/tauri/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles deb,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-preview
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  electron:
    name: Electron (install + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

  hardware:
    name: ESP32 firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      # MAC-011：全环境（默认 peripheral+observer；S3 三件套见 MAC-009 证据）
      - name: Build default firmware envs
        working-directory: hardware/esp32/LightBLE
        run: pio run

      - name: Build S3 fixture envs
        working-directory: hardware/esp32/LightBLE
        run: pio run -e fixture_peripheral_s3 -e fixture_observer_s3 -e fixture_shid_sim_s3

  uniapp:
    name: UniApp (full verify-uniapp.sh + h5 build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MAC-011：完整 verify-uniapp.sh（不再是子集）；TS 剥离需 Node >= 22.18 / >= 23.6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Checkout pinned Smart HID canonical contract
        run: |
          git clone --no-checkout https://github.com/LuoYaoSheng/smart-hid-workspace.git ../smart-hid-canonical
          git -C ../smart-hid-canonical checkout --detach ef4506795b8f689da110b223cc7bcb7770e22e1a

      - name: Install UniApp compiler dependencies
        run: npm ci --prefix apps/uniapp --legacy-peer-deps

      - name: Full UniApp verification suite
        env:
          SMART_HID_WORKSPACE: ../smart-hid-canonical
        run: bash scripts/verify-uniapp.sh

      - name: Build H5 (compiled-asset gate)
        run: npm run build:h5 --prefix apps/uniapp

      - name: Compiled asset gate
        run: node scripts/check-uniapp-assets.mjs --require-compiled

  release-metadata:
    name: Release metadata & gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # CI 首跑 2026-09-15：harness 自检含 Playwright 工具链校验（page-environment.test.mjs
      # 查 @playwright/test 可解析 + Chromium 可执行档），metadata job 需先装根级工具链
      - name: Install root toolchain (harness Playwright self-check)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Release metadata drift check
        run: node scripts/generate-release-metadata.mjs --check

      - name: Version consistency
        run: node scripts/check-version-consistency.mjs

      - name: Target contract suite (system layer)
        run: node scripts/verify-target.mjs --mode=system --format=json
