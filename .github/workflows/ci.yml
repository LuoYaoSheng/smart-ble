name: CI

on:
  push:
    branches:
      - main
      - master
      - refactor/multi-platform
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  apple:
    name: iOS / macOS (swift build)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift build (iOS package)
        working-directory: apps/ios
        run: swift build

  tauri:
    name: Tauri (cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: apps/desktop/tauri/src-tauri
        run: cargo check

  electron:
    name: Electron (install + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

  hardware:
    name: ESP32 firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: hardware/esp32/LightBLE
        run: pio run

  uniapp-contract:
    name: UniApp Smart HID contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Checkout pinned Smart HID canonical contract
        run: |
          git clone --no-checkout https://github.com/LuoYaoSheng/smart-hid-workspace.git ../smart-hid-canonical
          git -C ../smart-hid-canonical checkout --detach ef4506795b8f689da110b223cc7bcb7770e22e1a
      - name: Verify compatibility lock
        run: SMART_HID_WORKSPACE=../smart-hid-canonical node scripts/check-smart-hid-contract.mjs
      - name: Run UniApp provisioning tests
        run: |
          node tests/unit/provisioning.test.mjs
          node tests/unit/profile-contract.test.mjs
          node tests/unit/ble-runtime.test.mjs
          node tests/unit/provisioning-transport.test.mjs
          node tests/unit/smart-hid-profile.test.mjs
          node tests/unit/scan-session.test.mjs
          node tests/unit/advertisement.test.mjs
          node tests/unit/ble-platform.test.mjs
          node scripts/check-uniapp-assets.mjs
      - name: Install UniApp compiler dependencies
        run: npm ci --prefix apps/uniapp
      - name: Compile UniApp Vue SFCs
        run: |
          cd apps/uniapp
          node --input-type=module <<'EOF'
          import { readdir, readFile } from 'node:fs/promises'
          import { join } from 'node:path'
          import { parse, compileTemplate } from '@vue/compiler-sfc'
          async function files(dir) {
            const entries = await readdir(dir, { withFileTypes: true })
            return (await Promise.all(entries.map((entry) => entry.isDirectory() && !['node_modules', 'unpackage'].includes(entry.name) ? files(join(dir, entry.name)) : entry.name.endsWith('.vue') ? [join(dir, entry.name)] : []))).flat()
          }
          for (const file of await files('.')) {
            const source = await readFile(file, 'utf8')
            const parsed = parse(source, { filename: file })
            if (parsed.errors.length) throw new Error(`${file}: ${parsed.errors.join('\n')}`)
            if (parsed.descriptor.template) {
              const result = compileTemplate({ source: parsed.descriptor.template.content, filename: file, id: 'smart-ble' })
              if (result.errors.length) throw new Error(`${file}: ${result.errors.join('\n')}`)
            }
          }
          EOF
