name: All implementation candidates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        target: [android, flutter-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 scripts/release/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-unsigned-candidate
          path: |
            .tmp/release/**/report.json
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  apple:
    strategy:
      fail-fast: false
      matrix:
        target: [ios, flutter-ios, macos, flutter-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 scripts/release/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-apple-candidate
          path: |
            .tmp/release/
            apps/desktop/macos/dist/
            apps/flutter/build/ios/archive/
            apps/flutter/build/macos/Build/Products/Release/
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-22.04, ubuntu-22.04-arm]
        target: [electron, tauri]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.92.0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libudev-dev
      - if: matrix.target == 'tauri'
        run: cargo install tauri-cli --version 1.6.3 --locked
      - name: Build actual native package
        if: runner.os != 'Linux' || matrix.target != 'electron'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python3 scripts/release/build.py ${{ matrix.target }}
      - name: Build Electron Linux with Clang
        if: runner.os == 'Linux' && matrix.target == 'electron'
        env:
          CC: clang
          CXX: clang++
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python3 scripts/release/build.py electron
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.os }}-candidate
          path: |
            .tmp/release/**/report.json
            apps/desktop/electron/dist/
            apps/desktop/tauri/src-tauri/target/**/release/bundle/
          if-no-files-found: error

  windows-implementations:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        target: [avalonia, qt, wails]
        exclude:
          - os: windows-11-arm
            target: qt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-11-arm' && '3.14' || '3.12' }}
      - if: matrix.target == 'avalonia'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: matrix.target == 'wails'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/wails/go.mod
      - if: matrix.target == 'wails'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: python scripts/release/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.os }}-candidate
          path: |
            .tmp/release/
            apps/desktop/wails/build/bin/
          if-no-files-found: error

  flutter-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/flutter
        run: |
          flutter analyze
          flutter test
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.os }}-candidate
          path: apps/flutter/build/windows/*/runner/Release/
          if-no-files-found: error
