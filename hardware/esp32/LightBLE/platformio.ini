; PlatformIO Project Configuration File
; Smart BLE LightBLE fixture — reproducible build environments.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = fixture_peripheral, fixture_observer

; Shared fixture settings (not built directly)
[env:fixture_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board = esp32dev
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.mcu = esp32
board_build.f_crystal = 40000000L
board_build.partitions = partitions_ota.csv
extra_scripts = pre:../scripts/build-info.py
; Optional serial ports — unset env vars let PlatformIO auto-detect (DEC-012)
upload_port = ${sysenv.UPLOAD_PORT}
monitor_port = ${sysenv.MONITOR_PORT}
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DOTA_FAULT_INJECTION=1
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.0
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Backward-compatible alias for existing docs/scripts
[env:esp32dev]
extends = env:fixture_common
build_flags = ${env:fixture_common.build_flags} -DFIXTURE_ROLE=peripheral
build_src_filter = +<*> -<observer_main.cpp> -<observer_scanner.cpp> -<observer_parser.cpp> -<observer_events.cpp>

; Target contract: fixture_peripheral (GATT server fixture)
[env:fixture_peripheral]
extends = env:fixture_common
build_flags = ${env:fixture_common.build_flags} -DFIXTURE_ROLE=peripheral
build_src_filter = +<*> -<observer_main.cpp> -<observer_scanner.cpp> -<observer_parser.cpp> -<observer_events.cpp>

; DEF-001 fix: the physical fixture is ESP32-S3 (rev v0.2, 16MB quad flash,
; CH343 USB-serial — verified via esptool flash_id on the Windows host).
; S3 has no PSRAM-cache silicon issue and this firmware uses no PSRAM APIs,
; so BOARD_HAS_PSRAM / -mfix-esp32-psram-cache-issue are dropped here.
[env:fixture_common_s3]
extends = env:fixture_common
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DOTA_FAULT_INJECTION=1

; S3 variant of the GATT server fixture (same contract as fixture_peripheral)
[env:fixture_peripheral_s3]
extends = env:fixture_common_s3
build_flags = ${env:fixture_common_s3.build_flags} -DFIXTURE_ROLE=peripheral
build_src_filter = +<*> -<observer_main.cpp> -<observer_scanner.cpp> -<observer_parser.cpp> -<observer_events.cpp>

; DEF-006 diagnostic build: peripheral S3 + 3s serial heartbeat (loop liveness,
; connection flags, live advertising state, free heap). Diagnostic only.
[env:fixture_peripheral_s3_diag]
extends = env:fixture_peripheral_s3
build_flags = ${env:fixture_peripheral_s3.build_flags} -DDIAG_HEARTBEAT=1

; Target contract: fixture_observer (scan-only Observer fixture)
[env:fixture_observer]
extends = env:fixture_common
build_flags = ${env:fixture_common.build_flags} -DFIXTURE_ROLE=observer
build_src_filter =
    +<observer_main.cpp>
    +<observer_scanner.cpp>
    +<observer_parser.cpp>
    +<observer_events.cpp>
    -<main.cpp>
    -<ota_server.cpp>
    -<ble_peripheral.cpp>
    -<device_info.cpp>
    -<test_control.cpp>
    -<serial_events.cpp>
    -<permissions_demo.cpp>

; S3 variant of the scan-only Observer fixture (same contract as fixture_observer)
[env:fixture_observer_s3]
extends = env:fixture_common_s3
build_flags = ${env:fixture_common_s3.build_flags} -DFIXTURE_ROLE=observer
build_src_filter =
    +<observer_main.cpp>
    +<observer_scanner.cpp>
    +<observer_parser.cpp>
    +<observer_events.cpp>
    -<main.cpp>
    -<ota_server.cpp>
    -<ble_peripheral.cpp>
    -<device_info.cpp>
    -<test_control.cpp>
    -<serial_events.cpp>
    -<permissions_demo.cpp>
