; PlatformIO Project Configuration File
; Smart BLE LightBLE fixture — reproducible build environments.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = fixture_peripheral, fixture_observer

; Shared fixture settings (not built directly)
[env:fixture_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board = esp32dev
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.mcu = esp32
board_build.f_crystal = 40000000L
board_build.partitions = partitions_ota.csv
extra_scripts = pre:../scripts/build-info.py
; Optional serial ports — unset env vars let PlatformIO auto-detect (DEC-012)
upload_port = ${sysenv.UPLOAD_PORT}
monitor_port = ${sysenv.MONITOR_PORT}
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DOTA_FAULT_INJECTION=1
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.0
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Backward-compatible alias for existing docs/scripts
[env:esp32dev]
extends = env:fixture_common
build_flags = ${env:fixture_common.build_flags} -DFIXTURE_ROLE=peripheral
build_src_filter = +<*> -<fixture_observer_stub.cpp>

; Target contract: fixture_peripheral (GATT server fixture)
[env:fixture_peripheral]
extends = env:fixture_common
build_flags = ${env:fixture_common.build_flags} -DFIXTURE_ROLE=peripheral
build_src_filter = +<*> -<fixture_observer_stub.cpp>

; Target contract: fixture_observer (scan-only fixture scaffold; full observer in ESP32-OBSERVER-001)
[env:fixture_observer]
extends = env:fixture_common
build_flags = ${env:fixture_common.build_flags} -DFIXTURE_ROLE=observer
build_src_filter = +<fixture_observer_stub.cpp> -<main.cpp> -<ota_server.cpp>
